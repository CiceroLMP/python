{% extends "base.html" %}
{% block titulo %}Versão REST{% endblock %}
{% block conteudo %}
<h4 class="mb-3"><i class="bi bi-cloud-arrow-down"></i> Versão REST (via fetch)</h4>
<p class="text-secondary">Esta página consome as rotas <code>/api/v1/tarefas</code> em JavaScript, sem recarregar a página.</p>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <h6 class="card-title">Adicionar tarefa</h6>
        <form id="form-rest" class="row g-2">
            <div class="col-md-4">
                <input type="text" id="rest-titulo" class="form-control" placeholder="Título" required>
            </div>
            <div class="col-md-4">
                <input type="text" id="rest-descricao" class="form-control" placeholder="Descrição">
            </div>
            <div class="col-md-3">
                <select id="rest-status" class="form-select">
                    {% for s in status_validos %}
                        <option value="{{ s }}">{{ status_labels[s] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i></button>
            </div>
        </form>
    </div>
</div>

<div id="lista-rest" class="row g-3"></div>

{% endblock %}

{% block scripts %}
<script>
const statusLabels = {{ status_labels|tojson }};
const cores = { pendente: "warning", em_andamento: "primary", concluida: "success" };

function carregarTarefas() {
    fetch("/api/v1/tarefas")
        .then(r => r.json())
        .then(tarefas => {
            const container = document.getElementById("lista-rest");
            if (tarefas.length === 0) {
                container.innerHTML = `<div class="col-12"><p class="text-secondary text-center py-4">Nenhuma tarefa cadastrada.</p></div>`;
                return;
            }
            container.innerHTML = tarefas.map(t => `
                <div class="col-md-4">
                    <div class="card border-${cores[t.status]} shadow-sm h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <h5 class="card-title">${t.titulo}</h5>
                                <span class="badge bg-${cores[t.status]}">${statusLabels[t.status]}</span>
                            </div>
                            <p class="card-text text-secondary">${t.descricao || "<em>Sem descrição</em>"}</p>
                            <button class="btn btn-sm btn-outline-danger" onclick="excluirTarefa(${t.id})">
                                <i class="bi bi-trash"></i> Excluir
                            </button>
                        </div>
                    </div>
                </div>
            `).join("");
        });
}

document.getElementById("form-rest").addEventListener("submit", function (e) {
    e.preventDefault();
    fetch("/api/v1/tarefas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            titulo: document.getElementById("rest-titulo").value,
            descricao: document.getElementById("rest-descricao").value,
            status: document.getElementById("rest-status").value,
        })
    }).then(r => r.json()).then(() => {
        this.reset();
        carregarTarefas();
    });
});

function excluirTarefa(id) {
    if (!confirm("Excluir esta tarefa?")) return;
    fetch(`/api/v1/tarefas/${id}`, { method: "DELETE" })
        .then(r => r.json())
        .then(() => carregarTarefas());
}

carregarTarefas();
</script>
{% endblock %}
