{% extends "base.html" %}
{% block titulo %}Progresso{% endblock %}
{% block conteudo %}
<h4 class="mb-3"><i class="bi bi-bar-chart-line"></i> Dashboard de progresso</h4>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h6 class="card-title text-center">Tarefas por status (barras)</h6>
                <canvas id="graficoBarras"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h6 class="card-title text-center">Tarefas por status (pizza)</h6>
                <canvas id="graficoPizza"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
fetch("/api/v1/progresso")
    .then(r => r.json())
    .then(dados => {
        new Chart(document.getElementById("graficoBarras"), {
            type: "bar",
            data: {
                labels: dados.labels,
                datasets: [{
                    label: "Quantidade de tarefas",
                    data: dados.valores,
                    backgroundColor: dados.cores,
                }]
            },
            options: {
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                plugins: { legend: { display: false } }
            }
        });

        new Chart(document.getElementById("graficoPizza"), {
            type: "pie",
            data: {
                labels: dados.labels,
                datasets: [{
                    data: dados.valores,
                    backgroundColor: dados.cores,
                }]
            }
        });
    });
</script>
{% endblock %}
